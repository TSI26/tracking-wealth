<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wealth">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Tracking by Wealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: two modes chosen by a switch. Desktop = sidebar + 12-col dashboard grid + spreadsheet-style table. Phone = narrow column, bottom nav, add sheet. */
:root{
  --bg:#0f1420; --surface:#171e2d; --surface-2:#1f2839; --line:#2a3447;
  --fg:#e8ecf4; --muted:#8d97ab; --accent:#5b8cff; --accent-ink:#0b1430;
  --spend:#ff6b5e; --spend-soft:rgba(255,107,94,.14);
  --earn:#2fd39a; --earn-soft:rgba(47,211,154,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f4f8; --surface:#ffffff; --surface-2:#eef1f7; --line:#dde2ec;
    --fg:#141a28; --muted:#5f6a80; --accent:#2f63e6; --accent-ink:#ffffff;
    --spend:#e0473a; --spend-soft:rgba(224,71,58,.10);
    --earn:#0f9e6c; --earn-soft:rgba(15,158,108,.10);
    --shadow:0 8px 24px rgba(20,30,60,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#eef1f7; --line:#dde2ec;
  --fg:#141a28; --muted:#5f6a80; --accent:#2f63e6; --accent-ink:#ffffff;
  --spend:#e0473a; --spend-soft:rgba(224,71,58,.10);
  --earn:#0f9e6c; --earn-soft:rgba(15,158,108,.10);
  --shadow:0 8px 24px rgba(20,30,60,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.01em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand small{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--muted)}
.brand b{color:var(--accent)}

/* mode switch */
.mode-switch{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.mode-switch button{border:0;background:transparent;border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13px}
.mode-switch button svg{width:16px;height:16px;flex:none}
.mode-switch button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ===== shared pieces ===== */
.banner{margin-bottom:16px;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13.5px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav button:disabled{opacity:.35;cursor:default}
.nav .label{font-family:var(--font-display);font-weight:700;font-size:18px;min-width:150px;text-align:center;text-transform:capitalize}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:12px}

.kpis{display:grid;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .k-label i{width:8px;height:8px;border-radius:50%;display:inline-block}
.kpi .k-val{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-sub{font-size:13px;color:var(--muted)}
.kpi.balance{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%)}
.delta{font-weight:600}
.delta.good{color:var(--earn)} .delta.bad{color:var(--spend)}

.grid{display:grid;gap:12px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 2px;font-family:var(--font-display);font-weight:700;font-size:17px}
.card .hint{margin:0 0 12px;font-size:13px;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13.5px;padding:2px 0}
.chart-box{position:relative;height:240px}

.donut-box{position:relative;height:190px;max-width:230px;margin:0 auto 10px}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-center span{display:block;font-size:12px;color:var(--muted)}
.donut-center strong{font-family:var(--font-display);font-size:20px}

.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.legend li:last-child{border-bottom:0}
.legend .dot{width:10px;height:10px;border-radius:3px}
.legend .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pct{color:var(--muted);font-size:12.5px;min-width:38px;text-align:right}
.legend .amt{font-weight:600;min-width:76px;text-align:right}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-row .bar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.bar-row .bar-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:6px}

.pay{display:flex;flex-direction:column;gap:10px}
.pay-stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}

.top-list{list-style:none;margin:0;padding:0}
.top-list li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.top-list li:last-child{border-bottom:0}
.empty-card{text-align:center;padding:28px 18px;color:var(--muted);font-size:14px}

.cat-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-family:var(--font-display);font-weight:800;font-size:13px}
.cat-ic.sm{width:26px;height:26px;border-radius:8px;font-size:11px}
.grow{flex:1;min-width:0}
.t-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt-d{color:var(--spend);font-weight:700;white-space:nowrap}
.amt-r{color:var(--earn);font-weight:700;white-space:nowrap}

.h-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none}
.select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600}
.h-summary{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}

.welcome{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px;display:grid;gap:16px;justify-items:start}
.welcome h2{margin:0;font-family:var(--font-display);font-size:30px;line-height:1.1;text-wrap:balance;max-width:22ch}
.welcome p{margin:0;color:var(--muted);max-width:56ch}
.welcome .row{display:flex;flex-wrap:wrap;gap:10px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 18px;border-radius:12px}
.demo-flag{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.demo-flag button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0}

/* ===== DESKTOP MODE ===== */
.app{min-height:100vh}
.m-desk .app{display:grid;grid-template-columns:240px minmax(0,1fr)}
.side{display:none}
.m-desk .side{display:flex;position:sticky;top:0;height:100vh;padding:24px 16px 18px;border-right:1px solid var(--line);background:var(--surface);flex-direction:column;gap:24px;z-index:20}
.side .brand{padding-inline:8px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav button{border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:12px;text-align:left}
.side-nav button svg{width:19px;height:19px;flex:none}
.side-nav button:hover{background:var(--surface-2);color:var(--fg)}
.side-nav button[aria-selected="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.side-add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 16px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.side-bal{padding:14px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px}
.side-bal span{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.side-bal strong{font-family:var(--font-display);font-size:22px}
.side-bal small{font-size:12.5px;color:var(--muted)}
.side .mode-switch button{flex:1;justify-content:center}

.m-desk .wrap{width:100%;max-width:1480px;margin:0 auto;padding-inline:32px;padding-block:28px 60px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;margin-bottom:20px}
.page-head h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.1}
.page-head h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:14px;color:var(--muted);margin-top:4px}

.m-desk .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.m-desk .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
.m-desk .c-months{grid-column:span 8}
.m-desk .c-catd{grid-column:span 4;grid-row:span 2}
.m-desk .c-bal{grid-column:span 8}
.m-desk .c-catr{grid-column:span 4}
.m-desk .c-top{grid-column:span 4}
.m-desk .c-pay{grid-column:span 4}
.m-desk .c-recent{grid-column:span 8}
.m-desk .c-months .chart-box{height:270px}

/* desktop narrow window: icon rail + stacked grid */
@media (max-width:1100px){
  .m-desk .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m-desk .c-months,.m-desk .c-bal,.m-desk .c-recent{grid-column:span 12}
  .m-desk .c-catd{grid-column:span 6;grid-row:auto}
  .m-desk .c-catr,.m-desk .c-top,.m-desk .c-pay{grid-column:span 6}
}
@media (max-width:820px){
  .m-desk .app{grid-template-columns:72px minmax(0,1fr)}
  .m-desk .side{padding:20px 10px;align-items:center}
  .m-desk .side .brand small,.m-desk .side .brand .full,.m-desk .side-nav button span,.m-desk .side-add span,.m-desk .side-bal,.m-desk .side .mode-switch button span{display:none}
  .m-desk .side .mode-switch{flex-direction:column}
  .m-desk .side-nav button,.m-desk .side-add{justify-content:center;padding:11px}
  .m-desk .wrap{padding-inline:18px}
  .m-desk .c-catd,.m-desk .c-catr,.m-desk .c-top,.m-desk .c-pay{grid-column:span 12}
}
.brand .mini{display:none}
@media (max-width:820px){.m-desk .side .brand .mini{display:inline;color:var(--accent)}}

/* spreadsheet table */
.sheet-table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:auto;margin-top:14px}
table.tx-table{width:100%;border-collapse:collapse;min-width:820px;font-size:14px}
.tx-table th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tx-table th.r,.tx-table td.r{text-align:right}
.tx-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tx-table tbody tr.row{cursor:pointer}
.tx-table tbody tr.row:hover td{background:var(--surface-2)}
.tx-table tbody tr:last-child td{border-bottom:0}
.tx-table .cell-cat{display:flex;align-items:center;gap:10px}
.tx-table .motif{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.d{background:var(--spend-soft);color:var(--spend)}
.pill.r{background:var(--earn-soft);color:var(--earn)}
.month-row td{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 12px}
.month-row td span{float:right;text-transform:none;letter-spacing:0}
tr.quick td{background:color-mix(in srgb,var(--accent) 7%,var(--surface));padding:8px 6px;border-bottom:2px solid var(--accent)}
tr.quick td:first-child{padding-left:12px}
tr.quick td:last-child{padding-right:12px}
.qf{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 9px;outline:none;min-width:0}
.qf:focus{border-color:var(--accent)}
.qf.amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.q-add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:9px;padding:8px 14px;white-space:nowrap}
.q-hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.q-err{color:var(--spend);font-weight:600}

/* ===== PHONE MODE ===== */
.ptop{display:none}
.m-phone .ptop{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.ptop-inner{max-width:480px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.ptop .brand{font-size:18px}
.ptop .mode-switch button{padding:6px 8px}
.ptop .mode-switch button span{display:none}
.m-phone .wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
.m-phone .page-head{margin-bottom:14px}
.m-phone .page-head h1{display:none}
.m-phone .period{width:100%;justify-content:space-between}
.m-phone .kpis{grid-template-columns:1fr 1fr}
.m-phone .kpi.balance{grid-column:1/-1;order:-1}
.m-phone .kpi.rate{display:none}
.m-phone .kpi .k-val{font-size:24px}
.m-phone .kpi.balance .k-val{font-size:32px}
.m-phone .grid{grid-template-columns:minmax(0,1fr)}
.m-phone .c-catd{order:1}.m-phone .c-catr{order:2}.m-phone .c-months{order:3}.m-phone .c-top{order:4}.m-phone .c-bal{order:5}.m-phone .c-pay{order:6}
.m-phone .c-recent{display:none}
.m-phone .welcome{padding:26px 20px}
.m-phone .welcome h2{font-size:25px}
.m-phone .h-tools .ghost{display:none}

.day{margin-top:16px}
.day-head{display:flex;justify-content:space-between;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:0 4px 6px}
.day-list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--surface-2)}

.mnav{display:none}
.m-phone .mnav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.mnav-inner{max-width:480px;margin:0 auto;padding-inline:24px;display:flex;justify-content:space-between;align-items:center}
.mtab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);width:80px}
.mtab[aria-selected="true"]{color:var(--fg)}
.mtab svg{width:22px;height:22px}
.fab{border:0;width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-28px;box-shadow:var(--shadow)}

/* ===== add / edit panel ===== */
.overlay{position:fixed;inset:0;background:rgba(5,8,16,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.m-phone .overlay{align-items:flex-end;padding:0}
.panel{background:var(--surface);width:100%;max-width:520px;border-radius:22px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.m-phone .panel{border-radius:22px 22px 0 0}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-head h2{margin:0;font-family:var(--font-display);font-size:20px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.type-toggle button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.type-toggle button.on-d{background:var(--spend);color:#fff}
.type-toggle button.on-r{background:var(--earn);color:#06261a}
.amount-field{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:18px 0 6px}
.amount-field input{border:0;background:transparent;font-family:var(--font-display);font-weight:800;font-size:48px;width:6ch;text-align:right;outline:none;padding:0;font-variant-numeric:tabular-nums}
.amount-field input::placeholder{color:var(--line)}
.amount-field span{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--muted)}
.f-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:16px 0 8px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.m-phone .cats{grid-template-columns:repeat(3,minmax(0,1fr))}
.cat-btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.15;text-align:center;min-width:0}
.cat-btn .cat-ic{width:30px;height:30px;font-size:12px}

<script>
(() => {
/* ---------- reference data ---------- */
const CATS = {
  d: [
    {id:'courses', name:'Courses', short:'Co', color:'#f59e0b'},
    {id:'resto', name:'Restos & fast-food', short:'Re', color:'#ef4444'},
    {id:'shopping', name:'Shopping & vêtements', short:'Sh', color:'#ec4899'},
    {id:'beaute', name:'Coiffeur & beauté', short:'Be', color:'#a855f7'},
    {id:'loisirs', name:'Loisirs & sorties', short:'Lo', color:'#6366f1'},
    {id:'abos', name:'Abonnements', short:'Ab', color:'#3b82f6'},
    {id:'transport', name:'Transport', short:'Tr', color:'#06b6d4'},
    {id:'tech', name:'Tech & matériel', short:'Te', color:'#14b8a6'},
    {id:'cadeaux', name:'Cadeaux', short:'Ca', color:'#f97316'},
    {id:'sante', name:'Santé', short:'Sa', color:'#84cc16'},
    {id:'invest', name:'Investissement & crypto', short:'In', color:'#eab308'},
    {id:'autre', name:'Autre', short:'…', color:'#94a3b8'}
  ],
  r: [
    {id:'ventes', name:'Ventes (Vinted…)', short:'Ve', color:'#10b981'},
    {id:'famille', name:'Famille & argent de poche', short:'Fa', color:'#22c55e'},
    {id:'job', name:'Job & babysitting', short:'Jo', color:'#06b6d4'},
    {id:'cadeau', name:'Cadeaux reçus', short:'Ca', color:'#a3e635'},
    {id:'rembours', name:'Remboursements', short:'Rb', color:'#38bdf8'},
    {id:'invest', name:'Investissement & crypto', short:'In', color:'#eab308'},
    {id:'autre', name:'Autre', short:'…', color:'#94a3b8'}
  ]
};
const PAYS = [
  {id:'cb', name:'Carte', color:'#5b8cff'},
  {id:'cash', name:'Espèces', color:'#f59e0b'},
  {id:'virement', name:'Virement', color:'#2fd39a'},
  {id:'cheque', name:'Chèque', color:'#c084fc'}
];
const catOf = (type, id) => CATS[type].find(c => c.id === id) || CATS[type][CATS[type].length - 1];
const payOf = id => PAYS.find(p => p.id === id) || PAYS[0];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const eurFmt = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR'});
const eur0Fmt = new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const eur = n => eurFmt.format(n);
const eur0 = n => eur0Fmt.format(n);
const pad = n => String(n).padStart(2, '0');
const dStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => dStr(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const monthName = (y, m) => new Date(y, m, 1).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
const monthShort = (y, m) => new Date(y, m, 1).toLocaleDateString('fr-FR', {month:'short'}).replace('.', '') + ' ' + String(y).slice(2);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2 = n => Math.round(n * 100) / 100;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const lsGet = (k, f) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const parseAmount = s => round2(parseFloat(String(s).replace(/\s/g, '').replace(',', '.')));

/* ---------- state ---------- */
const now = new Date();
const state = {
  mode: lsGet('tw-mode', null) || (window.innerWidth < 760 ? 'phone' : 'desk'),
  view: lsGet('tw-view', 'dash'),
  period: lsGet('tw-period', 'month'),
  cy: now.getFullYear(), cm: now.getMonth(),
  tx: [], demo: false, loaded: false, store: 'pending',
  me: null, isAdmin: false, adminUsers: [], adminAll: [], adminLoaded: false, viewAs: null,
  q: '', fType: 'all', fCat: 'all'
};
const lastPrefs = () => lsGet('tw-last', {type:'d', pay:{d:'cb', r:'virement'}});
const quick = {date: todayStr(), type: lastPrefs().type || 'd', cat: '', note: '', pay: '', amount: '', err: ''};
quick.pay = (lastPrefs().pay || {})[quick.type] || 'cb';

let col = null;
let charts = [];
const data = () => state.demo ? DEMO : state.viewAs ? state.adminAll.filter(t => t.user_id === state.viewAs.id) : state.tx;
const readOnly = () => !!state.viewAs;

/* ---------- storage (Supabase) ---------- */
const LOCAL_KEY = 'tw-local-tx';
const cfg = window.TW_CONFIG || {};
let sb = null;
function showBanner(text) { const b = $('#banner'); b.textContent = text || ''; b.hidden = !text; }
function useLocal(reason) {
  state.store = 'local'; state.tx = lsGet(LOCAL_KEY, []); state.loaded = true;
  showBanner(reason); render();
}
const rowToTx = r => ({id: r.id, user_id: r.user_id, type: r.type, amount: Number(r.amount), cat: r.cat, pay: r.pay, date: String(r.date).slice(0, 10), note: r.note || '', createdAt: Date.parse(r.created_at) || 0});
/* Sync strategy: one full load at login, then live updates pushed by Supabase Realtime.
   A full reload only happens when coming back to the app after a while (phones drop the live link in the background). */
let lastFetch = 0, rtChannel = null, localWriteUntil = 0;
const txSig = list => list.map(t => `${t.id}|${t.type}|${t.amount}|${t.cat}|${t.pay}|${t.date}|${t.note}`).sort().join('~');
function setTx(list) {
  const changed = txSig(list) !== txSig(state.tx) || !state.loaded;
  state.tx = list; state.loaded = true;
  if (state.tx.length && state.demo) state.demo = false;
  if (changed) render();
  return changed;
}
async function fetchAll() {
  if (!sb || !state.me) return;
  let all = [], from = 0;
  while (true) {
    const {data: rows, error} = await sb.from('transactions').select('*').eq('user_id', state.me).order('date', {ascending: false}).range(from, from + 999);
    if (error) { showBanner('Impossible de charger tes opérations. Détail : ' + (error.message || error.code || 'pas de réponse du serveur') + (error.code ? ' (code ' + error.code + ')' : '')); state.loaded = true; render(); return; }
    all = all.concat(rows);
    if (rows.length < 1000) break;
    from += 1000;
  }
  lastFetch = Date.now();
  showBanner(navigator.onLine === false ? 'Hors connexion : les nouvelles opérations ne peuvent pas être enregistrées.' : '');
  setTx(all.map(rowToTx));
}
function upsertLocal(row) {
  const t = rowToTx(row);
  if (t.user_id && t.user_id !== state.me) return false;
  const i = state.tx.findIndex(x => x.id === t.id);
  const next = [...state.tx];
  if (i > -1) next[i] = t; else next.push(t);

async function saveTx(t) {

  if (state.demo) state.demo = false;
  if (state.store === 'cloud') {
    localWriteUntil = Date.now() + 4000;
    const res = t.id ? await sb.from('transactions').update(body).eq('id', t.id).select().single() : await sb.from('transactions').insert(body).select().single();
    if (res.error) throw res.error;
    upsertLocal(res.data);
  } else {
    const list = lsGet(LOCAL_KEY, []);
    const full = {...body, createdAt: t.createdAt || Date.now()};
    if (t.id) { const i = list.findIndex(x => x.id === t.id); if (i > -1) list[i] = {id:t.id, ...full}; }

  }
}

    localWriteUntil = Date.now() + 4000;
    const {error} = await sb.from('transactions').delete().eq('id', id);
    if (error) throw error;
    removeLocal(id);
  } else { const list = lsGet(LOCAL_KEY, []).filter(x => x.id !== id); lsSet(LOCAL_KEY, list); state.tx = list; render(); }
}

async function onAuthSubmit(e) {
  e.preventDefault();
  const m = authMode;
  const msg = $('#a-msg'), btn = $('#a-submit');
  const fail = t => { msg.className = 'auth-msg err'; msg.textContent = t; btn.disabled = false; };
  const email = ($('#a-email') || {}).value ? $('#a-email').value.trim() : '';
  const pass = ($('#a-pass') || {}).value || '';
  const pass2 = ($('#a-pass2') || {}).value || '';
  if (email) authEmail = email;
  if (m !== 'recovery' && !/^\S+@\S+\.\S+$/.test(email)) return fail('Indique une adresse e-mail valide.');
  if ((m === 'login' || m === 'signup' || m === 'recovery') && pass.length < 6) return fail('Le mot de passe doit faire au moins 6 caractères.');
  if ((m === 'signup' || m === 'recovery') && pass !== pass2) return fail('Les deux mots de passe ne sont pas identiques.');
  btn.disabled = true; msg.className = 'auth-msg'; msg.textContent = {login: 'Connexion…', signup: 'Création du compte…', forgot: 'Envoi…', recovery: 'Enregistrement…'}[m];
  const rememberBox = $('#a-remember');
  try {
    if (m === 'login' || m === 'signup') {
      const remember = rememberBox ? rememberBox.checked : true;
      lsSet('tw-remember', remember);
      try { sessionStorage.setItem('tw-alive', '1'); } catch (x) {}
    }
    if (m === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: pass});
      if (error) throw error;
    } else if (m === 'signup') {
      const {data: d, error} = await sb.auth.signUp({email, password: pass, options: {emailRedirectTo: appUrl()}});
      if (error) throw error;
      if (!d.session) { authMode = 'login'; return showAuth('Compte créé. Ouvre le lien reçu par e-mail pour le confirmer (regarde aussi dans les indésirables), puis connecte-toi.', 'ok'); }
    } else if (m === 'forgot') {
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: appUrl()});
      if (error) throw error;
      authMode = 'login';
      return showAuth('Si un compte existe avec cette adresse, un e-mail vient de partir. Ouvre le lien qu’il contient pour choisir un nouveau mot de passe (regarde aussi dans les indésirables).', 'ok');
    } else if (m === 'recovery') {
      const {error} = await sb.auth.updateUser({password: pass});
      if (error) throw error;
      state.recovering = false;
      try { history.replaceState(null, '', appUrl()); } catch (x) {}
      authMode = 'login';
      hideAuth();
      if (state.store !== 'cloud') { state.store = 'cloud'; fetchAll(); checkAdmin(); }
      toast('Mot de passe modifié');
    }
  } catch (err) {
    fail(authError(err));
  }
}

  if (period === 'year') return {from: `${y}-01-01`, to: `${y}-12-31`};
  return {from: '0000-01-01', to: '9999-12-31'};
}

}

function groupBy(list, type) {
  const m = {};
  list.forEach(t => { m[t.cat] = (m[t.cat] || 0) + t.amount; });
  return Object.entries(m).map(([id, v]) => ({cat: catOf(type, id), v: round2(v)})).sort((a, b) => b.v - a.v);
}
function renderCatD(list, total) {
  const box = $('#cat-d');
  if (!list.length) { box.innerHTML = `<div class="empty-card">Aucune dépense sur cette période.</div>`; return; }
  const g = groupBy(list, 'd');
  box.innerHTML = `
    <div class="donut-box"><canvas id="ch-donut" aria-label="Répartition des dépenses"></canvas><div class="donut-center"><div><span>Total</span><strong class="num">${eur0(total)}</strong></div></div></div>
    <ul class="legend">${g.map(x => `<li><i class="dot" style="background:${x.cat.color}"></i><span class="name">${esc(x.cat.name)}</span><span class="pct num">${Math.round(x.v/total*100)} %</span><span class="amt num">${eur(x.v)}</span></li>`).join('')}</ul>`;
  charts.push(new Chart($('#ch-donut'), {
    type: 'doughnut',
    data: {labels: g.map(x => x.cat.name), datasets: [{data: g.map(x => x.v), backgroundColor: g.map(x => x.cat.color), borderColor: css('--surface'), borderWidth: 3, hoverOffset: 6}]},
    options: {cutout: '70%', maintainAspectRatio: false, plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => ` ${c.label} : ${eur(c.parsed)}`}}}}
  }));
}
function renderCatR(list, total) {
  const box = $('#cat-r');
  if (!list.length) { box.innerHTML = `<div class="empty-card">Aucun revenu sur cette période.</div>`; return; }

function txLine(t) {

function renderTop(list) {

function renderPay(list, total) {

  box.innerHTML = `<div class="pay">

  </div>`;
}
function monthList() {
  const out = [];
  if (state.period === 'month') { for (let k = 5; k >= 0; k--) { const d = new Date(state.cy, state.cm - k, 1); out.push([d.getFullYear(), d.getMonth()]); } }
  else if (state.period === 'year') { for (let m = 0; m < 12; m++) out.push([state.cy, m]); }
  else {
    const all = data(); if (!all.length) return out;
    const first = all.reduce((a, t) => t.date < a ? t.date : a, '9999');
    const last = all.reduce((a, t) => t.date > a ? t.date : a, todayStr());
    let d = new Date(+first.slice(0,4), +first.slice(5,7) - 1, 1);
    const end = new Date(+last.slice(0,4), +last.slice(5,7) - 1, 1);
    while (d <= end) { out.push([d.getFullYear(), d.getMonth()]); d = new Date(d.getFullYear(), d.getMonth() + 1, 1); }
  }
  return out;
}
function baseOpts() {
  const muted = css('--muted'), line = css('--line');
  return {
    maintainAspectRatio: false,
    interaction: {mode: 'index', intersect: false},
    plugins: {legend: {labels: {color: muted, boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: 'rectRounded', font: {family: 'Figtree'}}}},
    scales: {
      x: {grid: {display: false}, ticks: {color: muted, font: {family: 'Figtree'}, maxRotation: 0, autoSkip: true}, border: {color: line}},
      y: {grid: {color: line}, border: {display: false}, ticks: {color: muted, font: {family: 'Figtree'}, callback: v => eur0(v)}}
    }
  };
}
function renderMonths(all) {
  const months = monthList();
  const key = (y, m) => `${y}-${pad(m+1)}`;
  const dV = months.map(([y, m]) => sum(all.filter(t => t.date.startsWith(key(y, m))), 'd'));
  const rV = months.map(([y, m]) => sum(all.filter(t => t.date.startsWith(key(y, m))), 'r'));
  const o = baseOpts();
  o.plugins.tooltip = {callbacks: {label: c => ` ${c.dataset.label} : ${eur(c.parsed.y)}`}};
  charts.push(new Chart($('#ch-months'), {
    type: 'bar',
    data: {labels: months.map(([y, m]) => monthShort(y, m)), datasets: [
      {label: 'Dépenses', data: dV, backgroundColor: css('--spend'), borderRadius: 5, maxBarThickness: 28},
      {label: 'Revenus', data: rV, backgroundColor: css('--earn'), borderRadius: 5, maxBarThickness: 28}
    ]},
    options: o
  }));
}
function renderBalance(all, r) {
  const sorted = [...all].sort((a, b) => a.date < b.date ? -1 : 1);
  if (!sorted.length) return;
  const net = t => t.type === 'r' ? t.amount : -t.amount;
  const today = todayStr();
  let start, end, step;
  if (state.period === 'month') { start = r.from; end = r.to; step = 1; }
  else if (state.period === 'year') { start = r.from; end = r.to; step = 7; }
  else { start = sorted[0].date; end = sorted[sorted.length-1].date > today ? sorted[sorted.length-1].date : today; step = 7; }
  if (end > today && start <= today) end = today;
  let bal = 0, idx = 0;
  while (idx < sorted.length && sorted[idx].date < start) { bal += net(sorted[idx]); idx++; }
  const labels = [], values = [];
  let d = parseD(start); const endD = parseD(end);
  while (d <= endD) {
    const next = new Date(d); next.setDate(d.getDate() + step);
    const lim = dStr(new Date(Math.min(next - 86400000, endD)));
    while (idx < sorted.length && sorted[idx].date <= lim) { bal += net(sorted[idx]); idx++; }
    labels.push(d.toLocaleDateString('fr-FR', state.period === 'all' ? {day:'numeric', month:'short', year:'2-digit'} : {day:'numeric', month:'short'}));
    values.push(round2(bal));
    d = next;
  }
  const accent = css('--accent');
  const o = baseOpts();
  o.plugins.legend = {display: false};
  o.plugins.tooltip = {callbacks: {label: c => ` Solde : ${eur(c.parsed.y)}`}};
  o.scales.x.ticks.maxTicksLimit = 7;
  charts.push(new Chart($('#ch-bal'), {
    type: 'line',
    data: {labels, datasets: [{data: values, borderColor: accent, borderWidth: 2.5, tension: .3, fill: true,
      backgroundColor: ctx => { const ch = ctx.chart; const area = ch.chartArea; const g = ch.ctx.createLinearGradient(0, area ? area.top : 0, 0, area ? area.bottom : 240); g.addColorStop(0, accent + '55'); g.addColorStop(1, accent + '00'); return g; },
      pointRadius: values.map((_, i) => i === values.length - 1 ? 4 : 0), pointBackgroundColor: accent}]},
    options: o
  }));
}

  let rows = '', lastM = '';
  const monthTotals = {};
  list.forEach(t => { const k = t.date.slice(0,7); monthTotals[k] = (monthTotals[k] || 0) + (t.type === 'r' ? t.amount : -t.amount); });
  list.forEach(t => {
    const k = t.date.slice(0,7);
    if (k !== lastM) { lastM = k; const v = round2(monthTotals[k]); rows += `<tr class="month-row"><td colspan="6">${monthName(+k.slice(0,4), +k.slice(5,7)-1)}<span class="num">Solde du mois : ${v > 0 ? '+' : ''}${eur(v)}</span></td></tr>`; }
    const c = catOf(t.type, t.cat);
    rows += `<tr class="row" data-edit="${t.id}" tabindex="0">
      <td class="num">${parseD(t.date).toLocaleDateString('fr-FR')}</td>
      <td><span class="pill ${t.type}">${t.type === 'd' ? 'Dépense' : 'Revenu'}</span></td>
      <td><span class="cell-cat"><span class="cat-ic sm" style="background:${c.color}22;color:${c.color}">${c.short}</span>${esc(c.name)}</span></td>
      <td class="motif">${esc(t.note) || '<span style="color:var(--muted)">—</span>'}</td>
      <td>${payOf(t.pay).name}</td>
      <td class="r num ${t.type === 'd' ? 'amt-d' : 'amt-r'}">${t.type === 'd' ? '−' : '+'}${eur(t.amount)}</td>
    </tr>`;
  });
  return `<table class="tx-table">
    <colgroup><col style="width:130px"><col style="width:120px"><col style="width:22%"><col><col style="width:120px"><col style="width:150px"></colgroup>
    <thead><tr><th>Date</th><th>Type</th><th>Catégorie</th><th>Motif</th><th>Moyen</th><th class="r">Montant</th></tr></thead>
    <tbody>
      ${readOnly() ? '' : `<tr class="quick">
        <td><input id="q-date" class="qf" type="date" value="${quick.date}" aria-label="Date"></td>
        <td><select id="q-type" class="qf" aria-label="Type"><option value="d" ${quick.type==='d'?'selected':''}>Dépense</option><option value="r" ${quick.type==='r'?'selected':''}>Revenu</option></select></td>
        <td><select id="q-cat" class="qf" aria-label="Catégorie"><option value="">Catégorie…</option>${cats.map(c => `<option value="${c.id}" ${quick.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></td>
        <td><input id="q-note" class="qf" type="text" maxlength="80" placeholder="Motif (facultatif)" value="${esc(quick.note)}" aria-label="Motif"></td>
        <td><select id="q-pay" class="qf" aria-label="Moyen de paiement">${PAYS.map(p => `<option value="${p.id}" ${quick.pay===p.id?'selected':''}>${p.name}</option>`).join('')}</select></td>
        <td><div style="display:flex;gap:6px"><input id="q-amount" class="qf amt" inputmode="decimal" placeholder="0,00 €" value="${esc(quick.amount)}" aria-label="Montant"><button class="q-add" type="button" data-act="quick">Ajouter</button></div></td>
      </tr>`}
      ${rows || `<tr><td colspan="6"><div class="empty-card">${data().length ? 'Aucune opération ne correspond à ta recherche.' : 'Aucune opération pour l’instant. Remplis la ligne ci-dessus pour commencer.'}</div></td></tr>`}
    </tbody></table>`;
}
function bindQuick() {
  const on = (id, ev, fn) => { const n = document.getElementById(id); if (n) n.addEventListener(ev, fn); };
  on('q-date', 'change', e => { quick.date = e.target.value; });
  on('q-type', 'change', e => { quick.type = e.target.value; quick.cat = ''; quick.pay = (lastPrefs().pay || {})[quick.type] || (quick.type === 'd' ? 'cb' : 'virement'); renderHist(); document.getElementById('q-cat').focus(); });
  on('q-cat', 'change', e => { quick.cat = e.target.value; });
  on('q-note', 'input', e => { quick.note = e.target.value; });
  on('q-pay', 'change', e => { quick.pay = e.target.value; });
  on('q-amount', 'input', e => { quick.amount = e.target.value; });
  document.querySelectorAll('tr.quick .qf').forEach(n => n.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); quickSave(); } }));
}
async function quickSave() {
  if (readOnly()) return;
  const amount = parseAmount(quick.amount);
  quick.err = '';
  if (!quick.date) quick.err = 'Choisis une date.';
  else if (!quick.cat) quick.err = 'Choisis une catégorie.';
  else if (!amount || amount <= 0) quick.err = 'Indique un montant supérieur à 0.';
  if (quick.err) { renderHist(); document.getElementById(!quick.cat ? 'q-cat' : 'q-amount')?.focus(); return; }
  const payload = {type: quick.type, amount, cat: quick.cat, pay: quick.pay, date: quick.date, note: quick.note.trim()};
  quick.amount = ''; quick.note = '';
  try { await saveTx(payload); toast(payload.type === 'd' ? `Dépense de ${eur(amount)} ajoutée` : `Revenu de ${eur(amount)} ajouté`); }
  catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Stockage plein : supprime d’anciennes opérations.' : 'Enregistrement impossible : ' + ((e && e.message) || 'réessaie dans un instant.')); }
  renderHist();
  document.getElementById('q-cat')?.focus();
}
function listHtml(list) {
  if (!data().length) return `<div class="welcome" style="margin-top:16px"><h2>Aucune opération pour l’instant.</h2><p>Ajoute ta première dépense ou ton premier revenu avec le bouton « + ».</p></div>`;
  if (!list.length) return `<div class="empty-card">Aucune opération ne correspond à ta recherche.</div>`;
  const byDay = {};
  list.forEach(t => (byDay[t.date] ||= []).push(t));
  return Object.entries(byDay).map(([day, items]) => {
    const net = round2(items.reduce((a, t) => a + (t.type === 'r' ? t.amount : -t.amount), 0));
    return `<div class="day">
      <div class="day-head"><span>${parseD(day).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year: +day.slice(0,4) === now.getFullYear() ? undefined : 'numeric'})}</span><span class="num">${net > 0 ? '+' : ''}${eur(net)}</span></div>
      <div class="day-list">${items.map(t => { const c = catOf(t.type, t.cat); return `
        <button class="tx" type="button" data-edit="${t.id}">
          <span class="cat-ic" style="background:${c.color}22;color:${c.color}">${c.short}</span>
          <span class="grow"><span class="t-title" style="display:block">${esc(t.note || c.name)}</span><span class="t-sub" style="display:block">${t.note ? esc(c.name) + ' · ' : ''}${payOf(t.pay).name}</span></span>
          <span class="${t.type === 'd' ? 'amt-d' : 'amt-r'} num">${t.type === 'd' ? '−' : '+'}${eur(t.amount)}</span>
        </button>`; }).join('')}</div>
    </div>`;
  }).join('');
}
function bindHistTools(list) {
  const qi = $('#h-q');
  qi.addEventListener('input', () => { state.q = qi.value; clearTimeout(qi._t); qi._t = setTimeout(render, 180); });
  $('#h-type').addEventListener('change', e => { state.fType = e.target.value; state.fCat = 'all'; renderHist(); });
  $('#h-cat').addEventListener('change', e => { state.fCat = e.target.value; renderHist(); });
  $('#h-export').addEventListener('click', () => exportCsv(list));
}
async function exportCsv(list) {
  if (!list.length) return toast('Rien à exporter.');
  const rows = [['Date','Type','Catégorie','Montant','Moyen','Motif']].concat(
    [...list].sort((a,b) => a.date < b.date ? -1 : 1).map(t => [t.date, t.type === 'd' ? 'Dépense' : 'Revenu', catOf(t.type, t.cat).name, String(t.type === 'd' ? -t.amount : t.amount).replace('.', ','), payOf(t.pay).name, t.note || ''])
  );
  const csv = '﻿' + rows.map(r => r.map(v => /[;"\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v).join(';')).join('\n');
  try {
    {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
      a.download = `tracking-wealth-${todayStr()}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      return toast('Sauvegarde téléchargée');
    }
  } catch (e) { toast('Export annulé.'); }
}

/* ---------- add / edit panel ---------- */
let form = null;
function openPanel(tx) {
  if (readOnly()) return toast('Lecture seule : reviens à ton espace pour ajouter ou modifier.');
  if (state.demo && tx) return toast('Les exemples ne se modifient pas.');
  const last = lastPrefs();
  form = tx ? {...tx, amountStr: String(tx.amount).replace('.', ',')} :
    {type: last.type || 'd', amountStr: '', cat: null, pay: (last.pay || {})[last.type || 'd'] || 'cb', date: todayStr(), note: ''};
  form.confirm = false; form.err = '';
  drawPanel(true);
}
function drawPanel(first) {
  const f = form, isEdit = !!f.id;
  $('#panel-root').innerHTML = `
    <div class="overlay" id="ov">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title">
        <div class="panel-head"><h2 id="p-title">${isEdit ? 'Modifier' : 'Nouvelle opération'}</h2><button class="x" type="button" data-close aria-label="Fermer"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
        <div class="type-toggle" role="group" aria-label="Type">
          <button type="button" data-type="d" class="${f.type==='d'?'on-d':''}" aria-pressed="${f.type==='d'}">Dépense</button>
          <button type="button" data-type="r" class="${f.type==='r'?'on-r':''}" aria-pressed="${f.type==='r'}">Revenu</button>
        </div>
        <div class="amount-field"><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(f.amountStr)}" aria-label="Montant en euros" style="color:${f.type==='d'?'var(--spend)':'var(--earn)'}"><span>€</span></div>
        <div class="f-label">Catégorie</div>
        <div class="cats">${CATS[f.type].map(c => `<button type="button" class="cat-btn" data-cat="${c.id}" aria-pressed="${f.cat===c.id}"><span class="cat-ic" style="background:${c.color}22;color:${c.color}">${c.short}</span>${esc(c.name)}</button>`).join('')}</div>
        <div class="f-label">Moyen de paiement</div>
        <div class="chips">${PAYS.map(p => `<button type="button" class="chip" data-pay="${p.id}" aria-pressed="${f.pay===p.id}">${p.name}</button>`).join('')}</div>
        <div class="f-label">Date et motif (facultatif)</div>
        <div class="two">
          <input id="f-date" class="field" type="date" value="${f.date}" aria-label="Date">
          <input id="f-note" class="field" type="text" maxlength="80" placeholder="Ex. McDo avec Lina" value="${esc(f.note)}" aria-label="Motif">
        </div>
        <div class="err">${esc(f.err)}</div>
        <div class="panel-actions">
          ${isEdit ? `<button type="button" class="del" data-del>Supprimer</button>` : ''}
          <button type="button" class="save ${f.type}" data-save>${isEdit ? 'Enregistrer' : f.type === 'd' ? 'Ajouter la dépense' : 'Ajouter le revenu'}</button>
        </div>
        ${f.confirm ? `<div class="confirm"><span class="grow">Supprimer cette opération définitivement ?</span><button type="button" class="no" data-noconf>Annuler</button><button type="button" class="yes" data-yesconf>Supprimer</button></div>` : ''}
      </div>
    </div>`;
  const amt = $('#f-amount');
  amt.addEventListener('input', () => { f.amountStr = amt.value; });
  $('#f-date').addEventListener('change', e => { f.date = e.target.value; });
  $('#f-note').addEventListener('input', e => { f.note = e.target.value; });
  amt.addEventListener('keydown', e => { if (e.key === 'Enter') panelSave(); });
  $('#f-note').addEventListener('keydown', e => { if (e.key === 'Enter') panelSave(); });
  if (first && !f.id && state.mode === 'desk') amt.focus();
}
function closePanel() { $('#panel-root').innerHTML = ''; form = null; }
async function panelSave() {
  const f = form;
  const amount = parseAmount(f.amountStr);
  if (!amount || amount <= 0) { f.err = 'Indique un montant supérieur à 0.'; return drawPanel(); }
  if (!f.cat) { f.err = 'Choisis une catégorie.'; return drawPanel(); }
  if (!f.date) { f.err = 'Choisis une date.'; return drawPanel(); }
  const isEdit = !!f.id;
  const payload = {id: f.id, type: f.type, amount, cat: f.cat, pay: f.pay, date: f.date, note: f.note.trim(), createdAt: f.createdAt};
  closePanel();
  try { await saveTx(payload); toast(isEdit ? 'Modifié' : (payload.type === 'd' ? `Dépense de ${eur(amount)} ajoutée` : `Revenu de ${eur(amount)} ajouté`)); }
  catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Stockage plein : supprime d’anciennes opérations.' : 'Enregistrement impossible : ' + ((e && e.message) || 'réessaie dans un instant.')); }
}

function toast(msg) {
  const r = $('#toast-root');
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => { r.innerHTML = ''; }, 2400);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, .overlay, tr.row');
  if (!t) return;
  if (t.id === 'ov' && e.target === t) return closePanel();
  if (t.dataset.mode) { state.mode = t.dataset.mode; lsSet('tw-mode', state.mode); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.view) { state.view = t.dataset.view; lsSet('tw-view', state.view); render(); window.scrollTo(0, 0); if (state.view === 'admin' && state.adminLoaded && Date.now() - (state.adminFetchedAt || 0) > 30000) fetchAdmin(); return; }
  if (t.dataset.act === 'logout') { if (sb) await logout(); else toast('Pas de compte connecté en mode local.'); return; }
  if (t.dataset.act === 'stopview') { state.viewAs = null; state.view = 'admin'; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.see) { const u = state.adminUsers.find(x => x.id === t.dataset.see); if (u) { state.viewAs = u.id === state.me ? null : {id: u.id, email: u.email}; state.view = 'dash'; render(); window.scrollTo(0, 0); } return; }
  if (t.dataset.act === 'adminrefresh') { state.adminLoaded = false; render(); fetchAdmin(); return; }
  if (t.dataset.act === 'add') return openPanel();
  if (t.dataset.act === 'quick') return quickSave();
  if (t.dataset.act === 'demo') { state.demo = true; render(); return; }
  if (t.dataset.act === 'nodemo') { state.demo = false; render(); return; }
  if (t.dataset.period) { state.period = t.dataset.period; lsSet('tw-period', state.period); state.cy = now.getFullYear(); state.cm = now.getMonth(); render(); return; }
  if (t.dataset.step) {
    const s = +t.dataset.step;
    if (state.period === 'month') { const d = new Date(state.cy, state.cm + s, 1); state.cy = d.getFullYear(); state.cm = d.getMonth(); }
    else state.cy += s;
    render(); return;
  }
  if (t.dataset.edit) { const tx = data().find(x => x.id === t.dataset.edit); if (tx) openPanel(tx); return; }
  if (!form) return;
  if (t.hasAttribute('data-close')) return closePanel();
  if (t.dataset.type) { if (form.type !== t.dataset.type) { form.type = t.dataset.type; form.cat = null; form.pay = (lastPrefs().pay || {})[form.type] || (form.type === 'd' ? 'cb' : 'virement'); } form.err = ''; return drawPanel(); }
  if (t.dataset.cat) { form.cat = t.dataset.cat; form.err = ''; return drawPanel(); }
  if (t.dataset.pay) { form.pay = t.dataset.pay; return drawPanel(); }
  if (t.hasAttribute('data-save')) return panelSave();
  if (t.hasAttribute('data-del')) { form.confirm = true; return drawPanel(); }
  if (t.hasAttribute('data-noconf')) { form.confirm = false; return drawPanel(); }
  if (t.hasAttribute('data-yesconf')) { const id = form.id; closePanel(); try { await deleteTx(id); toast('Opération supprimée'); } catch { toast('Suppression impossible. Réessaie.'); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && form) closePanel();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr.row')) { const tx = data().find(x => x.id === e.target.dataset.edit); if (tx) openPanel(tx); }
});

const mq = window.matchMedia('(prefers-color-scheme: dark)');
const rerender = () => { if (state.view === 'dash') renderDash(); };
mq.addEventListener?.('change', rerender);
new MutationObserver(rerender).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

render();
initStore();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
})();
</script>

</body>
</html>
